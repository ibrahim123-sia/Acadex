<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- seo: the build writes each public page's own tags here (src/lib/seo-pages.ts) -->
    <title>Acadex — AI-native platform for schools, colleges &amp; universities</title>
    <meta name="description" content="Admissions, courses, attendance, exams, fees and family communication in one secure platform — with an AI tutor and teacher copilot that keep people in control." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Acadex" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /seo -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Acadex" />
    <script>
      // apply the saved theme before first paint (no flash of the wrong theme)
      try {
        var t = localStorage.getItem('acadex.theme') || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        if (localStorage.getItem('acadex.lowBandwidth') === '1') document.documentElement.setAttribute('data-low-bandwidth', '');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Acadex needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

server {
  listen 80;
  root /usr/share/nginx/html;

  # security headers for the app shell
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # same-origin API (refresh cookie stays first-party)
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # hashed assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # single-page app: unknown paths serve index.html (never cached)
  location / {
    # public pages have their own HTML (title and link-preview tags): /pricing → /pricing.html
    try_files $uri $uri.html /index.html;
    add_header Cache-Control "no-cache";
  }
}

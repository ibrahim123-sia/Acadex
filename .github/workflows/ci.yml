name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acadex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # superuser URL; the test setup creates the non-superuser role acadex_app (RLS applies to it)
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w @acadex/api
      - run: npm run typecheck -w @acadex/api
      - run: npm test -w @acadex/api
      - name: Migrations apply cleanly twice on an empty database, then seed
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_migrate_check
          DATABASE_SSL: 'false'
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE acadex_migrate_check"
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
      - name: Backup and restore drill (row counts must match)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_migrate_check
          SCRATCH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_restore_check
          BACKUP_ENCRYPTION_KEY: ci-only-backup-key
        run: |
          sudo apt-get install -y -qq postgresql-client-16 > /dev/null || true
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE acadex_restore_check"
          ops/verify-restore.sh
      - run: npm run build -w @acadex/api
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w @acadex/web
      - run: npm run typecheck -w @acadex/web
      - run: npm test -w @acadex/web
      - run: npm run build -w @acadex/web

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and web images
        run: |
          docker build -f apps/api/Dockerfile -t acadex-api:ci .
          docker build -f apps/web/Dockerfile -t acadex-web:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # known vulnerabilities in production dependencies fail the build
      - name: Dependency scan
        run: npm audit --omit=dev --audit-level=high
      # secrets committed by mistake (keys, tokens, private keys) fail the build
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

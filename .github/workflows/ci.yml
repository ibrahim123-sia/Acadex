name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acadex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # superuser URL; the test setup creates the non-superuser role acadex_app (RLS applies to it)
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w @acadex/api
      - run: npm run typecheck -w @acadex/api
      - run: npm test -w @acadex/api
      - name: Migrations apply cleanly twice on an empty database, then seed
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_migrate_check
          DATABASE_SSL: 'false'
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE acadex_migrate_check"
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
      - name: Backup and restore drill (row counts must match)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_migrate_check
          SCRATCH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_restore_check
          BACKUP_ENCRYPTION_KEY: ci-only-backup-key
        run: |
          sudo apt-get install -y -qq postgresql-client-16 > /dev/null || true
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE acadex_restore_check"
          ops/verify-restore.sh
      - run: npm run build -w @acadex/api
      - name: The built server starts and stays connected (smoke test of dist/, as the image runs it)
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_migrate_check
          DATABASE_SSL: 'false'
          JWT_SECRET: 'test-ci-jwt-secret-0123456789abcdef0123456789'
          PORT: '5055'
        run: |
          node dist/db/migrate.js
          node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5055/api/health > /dev/null && break; sleep 1; done
          sleep 3
          curl -sf http://localhost:5055/api/health | grep -q '"db":"connected"' || { cat server.log; exit 1; }
          kill %1
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w @acadex/web
      - run: npm run typecheck -w @acadex/web
      - run: npm test -w @acadex/web
      - run: npm run build -w @acadex/web

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix cloudflare
      - run: npm run typecheck --prefix cloudflare
      - name: The Worker config and bundle are valid (nothing is deployed)
        working-directory: cloudflare
        run: |
          mkdir -p ../apps/web/dist
          npx wrangler deploy --dry-run --containers-rollout=none --outdir ../.wrangler-dry

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the API and web images
        run: |
          docker build -f apps/api/Dockerfile -t acadex-api:ci .
          docker build -f apps/web/Dockerfile -t acadex-web:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # known vulnerabilities in production dependencies fail the build
      - name: Dependency scan
        run: npm audit --omit=dev --audit-level=high
      # secrets committed by mistake (keys, tokens, private keys) fail the build
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

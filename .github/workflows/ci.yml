name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acadex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acadex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w @acadex/api
      - run: npm run typecheck -w @acadex/api --if-present
      - run: npm test -w @acadex/api
      - name: Migrations apply cleanly twice on an empty database
        working-directory: apps/api
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE acadex_migrate_check"
          export DATABASE_URL=postgres://postgres:postgres@localhost:5432/acadex_migrate_check DATABASE_SSL=false
          npm run db:migrate
          npm run db:migrate
      - run: npm run build -w @acadex/api --if-present
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w @acadex/web
      - run: npm run typecheck -w @acadex/web --if-present
      - run: npm run build -w @acadex/web
